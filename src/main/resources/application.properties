spring.application.name=corschecars-api
server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=corschecars
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=corschecars
spring.flyway.default-schema=corschecars

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:3600}

springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
